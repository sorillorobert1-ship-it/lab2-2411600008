<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Reservation - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card login-card shadow-lg border-0">
            <header class="login-header text-center">
             <img src="images/logo.png"
     alt="Robert Hotel logo"
     class="brand-logo">
                <h1 class="h3 mb-1">Robert Hotel</h1>
                <p class="mb-0">Hotel Reservation Management System</p>
            </header>

            <div class="card-body p-4 p-md-5">
                <div id="loginAlert" class="alert d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               placeholder="Enter username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password"
                               placeholder="Enter password" required>
                    </div>

                    <button type="button" id="loginBtn" class="btn btn-primary btn-lg w-100">
                        Login
                    </button>
                </form>

               
            </div>

            <footer class="text-center small text-muted pb-4">
                © 2026 Robert Hotel
            </footer>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
